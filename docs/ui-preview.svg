<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Receipt Lens interface preview</title>
  <desc id="desc">A Kotlin Multiplatform receipt review app with an Android ML Kit scan flow and editable extracted fields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf2eb"/><stop offset="1" stop-color="#f6eee6"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17393a"/><stop offset="1" stop-color="#29494a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#19302d" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="111" cy="110" r="90" fill="#dce8dc" opacity=".7"/><circle cx="1090" cy="760" r="150" fill="#f1dfcb" opacity=".52"/>
  <text x="100" y="116" fill="#17393a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RECEIPT LENS · KOTLIN MULTIPLATFORM</text>
  <text x="100" y="206" fill="#17393a" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="750">From pixels to a clearer record.</text>
  <text x="103" y="250" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="20">Android ML Kit recognition. Shared, cautious extraction. Human-confirmed fields.</text>
  <g filter="url(#shadow)" transform="translate(424 290)">
    <rect width="352" height="538" rx="38" fill="#fff"/>
    <rect x="0" y="0" width="352" height="538" rx="38" fill="#f3f5f0"/>
    <rect x="20" y="20" width="42" height="42" rx="13" fill="#17685d"/>
    <path d="M34 29h14v20l-3-2-4 2-3-2-4 2z" fill="#f7f6f0"/>
    <text x="74" y="40" fill="#182a2a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Receipt Lens</text>
    <text x="74" y="56" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="7" letter-spacing="1.2">PRIVATE BY DESIGN · 2 SAVED</text>
    <rect x="262" y="27" width="69" height="30" rx="15" fill="#fff" stroke="#e2e8e1"/><text x="281" y="46" fill="#354640" font-family="Inter,Arial,sans-serif" font-size="10">Sage</text>
    <rect x="20" y="78" width="312" height="190" rx="24" fill="url(#hero)"/>
    <rect x="38" y="95" width="98" height="21" rx="11" fill="#397064"/><text x="48" y="109" fill="#c8eadb" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">ON-DEVICE OCR</text>
    <text x="38" y="158" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750">From pixels</text>
    <text x="38" y="188" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750">to a clearer record.</text>
    <text x="38" y="211" fill="#d0dfd8" font-family="Inter,Arial,sans-serif" font-size="10">Check every suggestion against the original.</text>
    <rect x="38" y="225" width="276" height="31" rx="10" fill="#b9e7d0"/><text x="111" y="245" fill="#163638" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">Choose a receipt photo</text>
    <text x="22" y="298" fill="#182a2a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Review drafts</text>
    <text x="22" y="313" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="9">Keep a few scans in progress</text>
    <rect x="22" y="323" width="120" height="25" rx="12" fill="#e8f1eb" stroke="#17685d"/><text x="39" y="339" fill="#283c37" font-family="Inter,Arial,sans-serif" font-size="9">North Star Market</text>
    <rect x="20" y="359" width="312" height="136" rx="20" fill="#fff"/>
    <rect x="35" y="374" width="80" height="106" rx="8" fill="#f3f1eb"/>
    <text x="45" y="391" fill="#283c37" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700">NORTH STAR</text>
    <text x="45" y="403" fill="#283c37" font-family="Inter,Arial,sans-serif" font-size="6">INVOICE ID: NS-2048</text>
    <text x="45" y="415" fill="#283c37" font-family="Inter,Arial,sans-serif" font-size="6">DATE: 30/10/2026</text>
    <text x="45" y="448" fill="#283c37" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700">TOTAL AED 135.40</text>
    <text x="129" y="381" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700" letter-spacing=".8">SOURCE IMAGE</text>
    <text x="129" y="400" fill="#182a2a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">9 lines recognized</text>
    <text x="129" y="427" fill="#17685d" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700">ORIGINAL</text>
    <rect x="20" y="506" width="312" height="13" rx="6" fill="#f3f5f0"/>
  </g>
  <g transform="translate(830 363)">
    <circle cx="20" cy="20" r="19" fill="#17685d"/><text x="14" y="26" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">1</text>
    <text x="53" y="16" fill="#17393a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Keep the boundary clear</text>
    <text x="53" y="42" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="13">Native image types + ML Kit stay on Android.</text>
    <text x="53" y="63" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="13">Plain OCR data and label rules live in commonMain.</text>
    <circle cx="20" cy="143" r="19" fill="#e6b76b"/><text x="14" y="149" fill="#17393a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">2</text>
    <text x="53" y="139" fill="#17393a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Let people verify every field</text>
    <text x="53" y="165" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="13">Candidates stay editable beside the source image.</text>
    <text x="53" y="186" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="13">Nothing is accepted or saved automatically.</text>
  </g>
  <text x="100" y="837" fill="#647572" font-family="Inter,Arial,sans-serif" font-size="12">Vector interface preview · not a device screenshot · sample receipt is fictional</text>
</svg>
